[build-system]
requires = ["setuptools>=83.0.0", "wheel>=0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rawtims"
version = "0.1.0"
description = "Raw ID-TIMS data review: IsotopX IsoprobeT runs to cycle-filtered ratios for ID-TIMS reduction."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  {name = "rawtims contributors"}
]
dependencies = [
  "numpy>=2.5.1",
  "xlrd==2.0.2",
]

[project.optional-dependencies]
gui = [
  "PySide6>=6.12.0",
  "pyqtgraph>=0.14.0",
  "openpyxl>=3.1.5",
]
build = [
  "PyInstaller>=6.17.0,<7",
  "pyinstaller-hooks-contrib>=2025.9",
]
dev = [
  "pillow>=12.0.0",
  "pytest>=9.1.1",
  "ruff>=0.15.21",
]

[project.scripts]
filament-gui = "rawtims_gui.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["rawtims*", "rawtims_gui*"]

[tool.setuptools.package-data]
rawtims_gui = ["studio/assets/icons/*.svg", "assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: individual tests taking more than about 20 s; excluded from QUICK unless their file changed",
  "isolated: wall-clock latency assertions; run this file alone after parallel chunks finish",
]
